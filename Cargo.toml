[workspace]
members = ["crates/model", "crates/client", "crates/backend"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "signal"] }
uuid = { version = "1", features = ["serde", "v4"] }
