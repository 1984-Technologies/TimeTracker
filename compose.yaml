services:
  timetracker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GRPC_BIND_ADDR: 0.0.0.0:50051
      HTTP_BIND_ADDR: 0.0.0.0:8080
      STATIC_DIR: /app/frontend
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${GRPC_PORT:-50051}:50051"
