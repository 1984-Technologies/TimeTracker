[package]
name = "timetracker-backend"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
jsonwebtoken = { version = "9", default-features = false }
sha2 = "0.10"
subtle = "2"
url = "2"
async-trait.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "json"] }
argon2 = { version = "0.5", features = ["std"] }
timetracker-model = { path = "../model" }
timetracker-proto = { path = "../proto" }

time = { workspace = true, features = ["serde-well-known", "formatting", "parsing"] }
tonic.workspace = true
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { workspace = true, features = ["signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
tonic-build = { version = "0.12.3", features = ["prost"] }

[dev-dependencies]
timetracker-client = { path = "../client" }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
