[package]
name = "timetracker-backend"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
serde.workspace = true
sqlx = { workspace = true, features = ["postgres", "json"] }

timetracker-model = { path = "../model" }
timetracker-proto = { path = "../proto" }

time = { workspace = true, features = ["serde-well-known", "formatting", "parsing"] }
tonic.workspace = true
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { workspace = true, features = ["signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
tonic-build = { version = "0.12.3", features = ["prost"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
