[package]
name = "timetracker-client"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
time.workspace = true
timetracker-model = { path = "../model" }
timetracker-proto = { path = "../proto" }
tokio = { workspace = true, features = ["signal"] }
tonic.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
serde_json.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }

[target.'cfg(target_os = "macos")'.dependencies]
active-win-pos-rs = "0.11"
nsworkspace = "0.2"
powerwatch = "0.1"
rdev = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
input = "0.10"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops"] }
