[package]
name = "timetracker-client"
version.workspace = true
edition.workspace = true

[[bin]]
name = "timetracker-client"
path = "src/main.rs"
required-features = ["desktop-ui"]

[features]
desktop-ui = ["dep:tauri", "tauri/custom-protocol", "tauri/tray-icon", "dep:tauri-build", "dep:qrcode", "dep:open", "dep:arboard", "dep:tray-icon"]

[dependencies]
async-trait.workspace = true
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
time.workspace = true
timetracker-model = { path = "../model" }
timetracker-proto = { path = "../proto" }
tokio = { workspace = true, features = ["signal"] }
tonic.workspace = true
uuid.workspace = true
serde.workspace = true
url = "2"
tauri = { version = "2", optional = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }
open = { version = "5", optional = true }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"], optional = true }

[dev-dependencies]
axum.workspace = true
serde_json.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
active-win-pos-rs = "0.11"
nsworkspace = "0.2"
powerwatch = "0.1"
rdev = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
# Use the supported D-Bus backend instead of invoking deprecated AppIndicator APIs.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"], optional = true }
input = "0.10"
libc = "0.2"
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
