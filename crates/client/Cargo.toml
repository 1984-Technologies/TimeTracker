[package]
name = "timetracker-client"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait.workspace = true
timetracker-model = { path = "../model" }
tokio.workspace = true
time.workspace = true
uuid.workspace = true
protobuf = "4.34.0-release"
grpc = "0.9.0"
grpc-protobuf = "0.9.0"

[build-dependencies]
protobuf-codegen = "4.34.0-release"

[dev-dependencies]
time.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops"] }
