syntax = "proto3";

service Upload {
	rpc Send(Event) returns (Uuid) {}
}

message Uuid {
	uint64 hi = 1;
	uint64 lo = 2;
}

message IdleChanged {
	bool idle = 1;
}
message FocusedApplicationChanged {
	string app_id = 1;
	optional string title = 2;
}
message KeyboardButtonPressed {}
message MouseClicked {}
message MouseMoved {}

enum ObservationType {
	IDLE = 0;
    FOCUSED_APPLICATION = 1;
    KEYBOARD = 2;
    MOUSE_CLICK = 3;
    MOUSE_MOVE = 4;
}

message Available {}
message Unavailable {
	string reason = 1;
}

message AdapterStatus {
	oneof status {
		Available available = 1;
		Unavailable unavailable = 2;
	}
}

message CollectorStarted {}
message CollectorStopped {}
message Heartbeat {}
message Observation {
	oneof observationKind {
		IdleChanged idleChanged = 1;
		FocusedApplicationChanged focusedApplicationChanged = 2;
		KeyboardButtonPressed keyboardButtonPressed = 3;
		MouseClicked mouseClicked = 4;
		MouseMoved mouseMoved = 5;
	}	
}

message AdapterStatusEvent {
	string adapter_id = 1;
	ObservationType observationType = 2;	
	AdapterStatus status = 3;
}

message Event {
	Uuid id = 1;
	Uuid device_id = 2;
	sint64 occurred_at = 3;
	oneof kind {
		CollectorStarted collectorStarted = 5;
		CollectorStopped collectorStopped = 6;
		Heartbeat heartbeat = 7;
		Observation observation = 8;
		AdapterStatusEvent adapterStatus = 9;
	}
}
