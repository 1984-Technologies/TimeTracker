name: CI & Release

on:
  push:
    branches: [ "main", "master", "dev" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main", "master", "dev" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    name: Rust CI (Format, Lint, Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --all-targets --all-features

  # frontend-ci:
  #   name: Frontend CI
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: 'npm' # или pnpm / yarn
  #     - run: npm ci
  #     - run: npm run lint
  #     - run: npm test

  release:
    name: Build & Release Linux Client
    needs: [rust-ci]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build client binary (release)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare binary artifact
        run: |
          mkdir -p artifacts
          # Замените 'client' на имя вашего исполняемого файла
          cp target/x86_64-unknown-linux-gnu/release/client artifacts/client-linux-amd64
          chmod +x artifacts/client-linux-amd64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/client-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}