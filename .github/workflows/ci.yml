name: CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: timetracker_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d timetracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Protobuf Compiler
        uses: ./.github/actions/setup-protoc

      - name: Install Client Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libinput-dev libudev-dev libwebkit2gtk-4.1-dev libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: PostgreSQL Integration Tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/timetracker_test
        run: cargo test -p timetracker-backend --test postgres -- --ignored

      - name: Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --all-targets --all-features

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend Authentication Tests
        working-directory: frontend
        run: npm run test:auth

      - name: Test
        working-directory: frontend
        run: npm test

  release:
    name: Build & Release Linux Client
    needs: [rust-ci, frontend-ci]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Protobuf Compiler
        uses: ./.github/actions/setup-protoc

      - name: Install Client Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libinput-dev libudev-dev libwebkit2gtk-4.1-dev libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build client binary
        run: cargo build -p timetracker-client --features desktop-ui --release --target x86_64-unknown-linux-gnu

      - name: Prepare binary artifact
        run: |
          mkdir -p artifacts
          cp target/x86_64-unknown-linux-gnu/release/timetracker-client artifacts/client-linux-amd64
          chmod +x artifacts/client-linux-amd64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/client-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
