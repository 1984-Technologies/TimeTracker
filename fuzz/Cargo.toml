[package]
name = "timetracker-auth-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]
resolver = "3"

[features]
default = ["libfuzzer"]
libfuzzer = ["dep:libfuzzer-sys"]

[dependencies]
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
libfuzzer-sys = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
timetracker-backend = { path = "../crates/backend", features = ["fuzzing"] }
tonic = "0.12.3"
uuid = "1"

[[bin]]
name = "jwt_raw"
path = "fuzz_targets/jwt_raw.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "jwt_claims"
path = "fuzz_targets/jwt_claims.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "credentials"
path = "fuzz_targets/credentials.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "authorization"
path = "fuzz_targets/authorization.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]
